<!doctype html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Writer Bro — Kannada Screenplay Studio</title>
<meta name="theme-color" content="#171717">
<meta name="description" content="Kannada screenplay writing interface by Writer Bro.">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Writer Bro</div>
  <div class="divider"></div>
  <input id="scriptName" class="script-name" value="ಹೊಸ ಚಿತ್ರಕಥೆ" aria-label="Script title">
  <div class="top-actions">
    <button id="newBtn" class="tool">ಹೊಸದು</button>
    <button id="saveBtn" class="tool">ಉಳಿಸಿ</button>
    <button id="downloadBtn" class="tool">.WBS</button>
    <button id="printBtn" class="tool">PDF</button>
    <button id="shortcutsBtn" class="tool">⌨</button>
  </div>
</header>
<div class="app">
  <aside class="leftbar">
    <div class="side-title">SCENES</div>
    <div id="sceneList" class="scene-list"></div>
    <div class="side-bottom">
      <button id="focusBtn" class="focus-btn">◉ Focus Mode</button>
      <div class="unicode">ಕನ್ನಡ Unicode<br><span>Typing ready</span></div>
    </div>
  </aside>

  <main id="workspace" class="workspace">
    <div id="pages" class="pages"></div>
  </main>

  <aside class="rightbar">
    <div class="side-title">FORMAT</div>
    <button class="format active" data-type="scene"><b>Scene Heading</b><span>Ctrl 1</span></button>
    <button class="format" data-type="action"><b>Action</b><span>Ctrl 2</span></button>
    <button class="format" data-type="character"><b>Character</b><span>Ctrl 3</span></button>
    <button class="format" data-type="dialogue"><b>Dialogue</b><span>Ctrl 4</span></button>
    <button class="format" data-type="parenthetical"><b>Parenthetical</b><span>Ctrl 5</span></button>
    <button class="format" data-type="transition"><b>Transition</b><span>Ctrl 6</span></button>
    <div class="format-help">
      <div><kbd>Enter</kbd> ಹೊಸ ಸಾಲು</div>
      <div><kbd>Tab</kbd> format ಬದಲಿಸಿ</div>
      <div><kbd>Ctrl S</kbd> ಉಳಿಸಿ</div>
    </div>
  </aside>
</div>
<footer class="statusbar">
  <span id="sceneStat">0 scenes</span><span>•</span><span id="wordStat">0 words</span><span>•</span><span id="pageStat">1 page</span>
  <span class="status-right" id="saveStatus">Local autosave on</span>
</footer>

<div id="shortcuts" class="modal hidden">
  <div class="modal-card">
    <h2>Keyboard Shortcuts</h2>
    <p><kbd>Enter</kbd> New block</p><p><kbd>Tab</kbd> Change format</p><p><kbd>Shift Tab</kbd> Previous format</p>
    <p><kbd>Ctrl 1–6</kbd> Choose format</p><p><kbd>Ctrl S</kbd> Save</p>
    <button id="closeShortcuts" class="tool">Close</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
